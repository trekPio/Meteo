<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd: roczne zestawienie temperatury (Radar Timeline)</title>
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
<script src="https://cdn.amcharts.com/lib/5/radar.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/NordDark.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Responsive.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root { --line:#2a323c; --muted:#8c98a6; --fg:#e7ecf1; --acc:#5aa2f0; }
  body { margin:0; background:#12161b; color:var(--fg); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1160px; margin:20px auto; padding:0 20px; }
  .note { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .box { background:#1b2129; border:1px solid var(--line); border-radius:12px; padding:12px 10px 10px; }
  h2 { margin:0 4px; font-size:13px; color:var(--muted); letter-spacing:.04em; font-weight:600; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  .home { width:24px; height:24px; border-radius:7px; border:1px solid #3b4552; background:#222a33; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }
  .ytabs { display:flex; justify-content:flex-end; align-items:center; gap:18px; flex-wrap:wrap; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:8px -10px 0; padding:0 14px; }
  .ytabs .seg { display:flex; gap:18px; }
  .ytabs .sep { width:1px; height:18px; background:var(--line); }
  .ytabs button { border:0; background:none; color:var(--muted); padding:8px 0; cursor:pointer; font:inherit; font-size:13px; }
  .ytabs button:hover { color:var(--fg); }
  .ytabs button.on { color:var(--fg); box-shadow:inset 0 -2px 0 var(--acc); }
  #chartdiv { height:640px; }
  .play { display:flex; align-items:center; gap:12px; margin:0 8px; }
  .play button { width:34px; height:34px; border-radius:50%; border:1.5px solid #3b4552; background:#222a33; color:var(--fg); font-size:16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .play input { flex:1; accent-color:var(--acc); }
  .play span { color:var(--muted); font-size:13px; min-width:80px; text-align:right; }
  .lg { display:flex; align-items:center; gap:8px; margin:8px 8px 0; font-size:12px; color:var(--muted); }
  .lg .bar { flex:0 0 220px; height:8px; border-radius:4px; background:linear-gradient(90deg,#3f7bd9 0%,#3f7bd9 16.7%,#88c0d0 33.3%,#ebcb8b 50%,#ebcb8b 83.3%,#bf616a 100%); }
</style>
</head>
<body>
<main>
  <p class="note">Strona testowa – podgląd rocznego zestawienia temperatury na prawdziwych danych. Główna strona: <a href="../" style="color:#88c0d0">trekpio.github.io/Meteo</a></p>
  <section class="box">
    <h2><span class="home"><i class="ti ti-home"></i></span>Roczne zestawienie temperatury</h2>
    <div class="ytabs">
      <div class="seg" id="kind"><button data-k="temp" class="on">Normalna</button><button data-k="feels">Odczuwalna</button></div>
      <span class="sep"></span>
      <div class="seg" id="years"></div>
    </div>
    <div id="chartdiv"></div>
    <div class="play"><button id="playBtn" title="Odtwórz kolejne miesiące"><i class="ti ti-player-play"></i></button>
      <input type="range" id="slider" min="0" max="12" step="1" value="12"><span id="sliderLbl">Cały rok</span></div>
    <div class="lg">−20 °C<span class="bar"></span>40 °C · słupek = zakres min–maks dnia, kolor = średnia dobowa · kliknij miesiąc, aby go przybliżyć</div>
  </section>
</main>
<script>
const RAW = "https://raw.githubusercontent.com/trekPio/Meteo/main/";
const get = async (p) => { let r = await fetch(RAW + p + "?v=" + Date.now()).catch(() => null);
  if (!r || !r.ok) r = await fetch("../" + p + "?v=" + Date.now()); if (!r.ok) throw new Error(p); return r.json(); };
const KEYS = { temp: ["outdoor.temperature"], feels: ["outdoor.feels_like", "outdoor.app_temp"] };
const pick = (o, ks) => { for (const k of ks) if (o[k] != null) return o[k]; return null; };
const MONTHS = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
const MS = ["Sty", "Lut", "Mar", "Kwi", "Maj", "Cze", "Lip", "Sie", "Wrz", "Paź", "Lis", "Gru"];
const fmt = (x) => x.toLocaleString("pl-PL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const hexRgb = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mixHex = (a, b, f) => { const A = hexRgb(a), B = hexRgb(b); return "#" + A.map((x, i) => Math.round(x + (B[i] - x) * f).toString(16).padStart(2, "0")).join(""); };
function tempColor(t) {   // ta sama skala co termometr na stronie
  const D = "#3f7bd9", B = "#88c0d0", Y = "#ebcb8b", R = "#bf616a";
  if (t <= -10) return D; if (t < 0) return mixHex(D, B, (t + 10) / 10); if (t === 0) return B;
  if (t < 10) return mixHex(B, Y, t / 10); if (t <= 30) return Y; if (t < 40) return mixHex(Y, R, (t - 30) / 10); return R;
}

// 365 kategorii (dni roku bez 29 lutego): "01-01" … "12-31"
const DAYS = []; for (let m = 0; m < 12; m++) { const n = new Date(2025, m + 1, 0).getDate(); for (let d = 1; d <= n; d++) DAYS.push({ cat: `${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`, m, d }); }

let idx, years = [], year, kind = "temp", cache = {}, root, chart, series, meanSeries, xAxis, centerLbl, playTimer = null;

async function dailyStats(y) {
  if (cache[y]) return cache[y];
  const months = (idx.months || []).filter(m => m.startsWith(y + "-"));
  const rows = (await Promise.all(months.map(m => get(`data/hourly/${m}.json`).catch(() => [])))).flat();
  const acc = {};
  for (const r of rows) {
    const d = new Date(r.t * 1000).toLocaleDateString("sv-SE", { timeZone: "Europe/Warsaw" }).slice(5);
    const a = acc[d] || (acc[d] = { temp: [0, 0, 1e9, -1e9], feels: [0, 0, 1e9, -1e9] });
    for (const k of ["temp", "feels"]) { const v = pick(r, KEYS[k]); if (v == null) continue;
      a[k][0] += v; a[k][1]++; a[k][2] = Math.min(a[k][2], v); a[k][3] = Math.max(a[k][3], v); }
  }
  return (cache[y] = acc);
}

function buildChart() {
  root = am5.Root.new("chartdiv");
  const t = am5.Theme.new(root); t.rule("Label").set("fontSize", 11); t.rule("Grid").set("strokeOpacity", 0.07);
  root.setThemes([am5themes_Animated.new(root), am5themes_NordDark.new(root), t, am5themes_Responsive.new(root)]);
  chart = root.container.children.push(am5radar.RadarChart.new(root, {
    panX: false, panY: false, wheelX: "panX", wheelY: "zoomX", innerRadius: am5.percent(28), radius: am5.percent(86),
    startAngle: -84, endAngle: 264,   // przerwa u góry na oś temperatury
  }));
  chart.set("cursor", am5radar.RadarCursor.new(root, { behavior: "zoomX" })).lineY.set("visible", false);

  const xr = am5radar.AxisRendererCircular.new(root, { minGridDistance: 12 });
  xr.labels.template.set("forceHidden", true);
  xr.grid.template.set("forceHidden", true);
  xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "cat", renderer: xr }));
  const yr = am5radar.AxisRendererRadial.new(root, { axisAngle: -90, minGridDistance: 26 });
  yr.labels.template.setAll({ centerX: am5.p50, fontSize: 10 });
  const yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, { renderer: yr, min: -25, max: 40, strictMinMax: true, numberFormat: "#'°'" }));
  // linia 0 °C
  const zero = yAxis.createAxisRange(yAxis.makeDataItem({ value: 0 }));
  zero.get("grid").setAll({ stroke: am5.color(0x88c0d0), strokeOpacity: 0.45, strokeDasharray: [4, 4] });

  series = chart.series.push(am5radar.RadarColumnSeries.new(root, {
    xAxis, yAxis, categoryXField: "cat", valueYField: "hi", openValueYField: "lo",
    tooltip: am5.Tooltip.new(root, { labelText: "[bold]{label}[/]\nśrednio {mean}°C\nmin {lo}°C · maks {hi}°C" }),
  }));
  series.columns.template.setAll({ width: am5.percent(75), strokeOpacity: 0, cornerRadius: 2, tooltipText: "[bold]{label}[/]\nśrednio {mean}°C\nmin {lo}°C · maks {hi}°C" });
  series.columns.template.adapters.add("fill", (fill, target) => {
    const m = target.dataItem?.dataContext?.mean; return m == null ? fill : am5.color(tempColor(m));
  });
  meanSeries = chart.series.push(am5radar.RadarLineSeries.new(root, {
    xAxis, yAxis, categoryXField: "cat", valueYField: "mean", stroke: am5.color(0xe7ecf1), connectEnds: false,
  }));
  meanSeries.strokes.template.setAll({ strokeWidth: 1, strokeOpacity: 0.5 });

  // pasy miesięcy (jak kontynenty w demo): etykieta z nazwą i średnią, kliknięcie przybliża
  const cs = am5.ColorSet.new(root, {});
  MS.forEach((name, m) => {
    const first = DAYS.find(d => d.m === m).cat, last = [...DAYS].reverse().find(d => d.m === m).cat;
    const range = xAxis.createAxisRange(xAxis.makeDataItem({ above: true, category: first, endCategory: last }));
    const fill = range.get("axisFill");
    fill.setAll({ visible: true, fill: cs.getIndex(m * 2), fillOpacity: 1, dRadius: 22, innerRadius: -22, cursorOverStyle: "pointer", toggleKey: "active" });
    range.get("grid").set("forceHidden", true);
    range.get("label").setAll({ text: name, fill: am5.color(0xffffff), textType: "circular", radius: 7, fontSize: 11 });
    fill.events.on("click", (ev) => {
      if (ev.target.get("active")) xAxis.zoomToCategories(first, last); else xAxis.zoom(0, 1);
    });
  });
  centerLbl = chart.radarContainer.children.push(am5.Label.new(root, { textAlign: "center", centerX: am5.p50, centerY: am5.p50, text: "" }));
  chart.appear(800, 100);
}

async function update(month = 12) {
  const acc = await dailyStats(year);
  const data = DAYS.map(({ cat, m, d }) => {
    const a = acc[cat]?.[kind]; const show = a && a[1] && (month === 12 || m <= month);
    return show ? { cat, lo: +a[2].toFixed(1), hi: +a[3].toFixed(1), mean: +(a[0] / a[1]).toFixed(1), label: `${d} ${MS[m].toLowerCase()} ${year}` }
                : { cat, label: `${d} ${MS[m].toLowerCase()} ${year}` };
  });
  xAxis.data.setAll(data); series.data.setAll(data); meanSeries.data.setAll(data);
  const vals = data.filter(x => x.mean != null);
  const avg = vals.length ? vals.reduce((s, x) => s + x.mean, 0) / vals.length : null;
  const mn = vals.length ? vals.reduce((a, x) => x.lo < a.lo ? x : a) : null, mx = vals.length ? vals.reduce((a, x) => x.hi > a.hi ? x : a) : null;
  centerLbl.set("text", vals.length
    ? `[fontSize:2.2em bold]${year}[/]\n[fontSize:1em]${month === 12 ? "średnia roczna" : "średnia do: " + MONTHS[month].toLowerCase()}[/]\n[fontSize:1.5em]${fmt(avg)}°C[/]\n[fontSize:0.85em #88c0d0]min ${fmt(mn.lo)}° (${mn.label.replace(" " + year, "")})[/]\n[fontSize:0.85em #d08770]maks ${fmt(mx.hi)}° (${mx.label.replace(" " + year, "")})[/]`
    : `[fontSize:2.2em bold]${year}[/]\n[fontSize:1em]brak danych[/]`);
  document.getElementById("sliderLbl").textContent = month === 12 ? "Cały rok" : "do: " + MONTHS[month];
}

(async () => {
  idx = await get("data/index.json");
  years = [...new Set((idx.months || []).map(m => +m.slice(0, 4)))].sort();
  year = years[years.length - 1];
  const ybox = document.getElementById("years");
  ybox.innerHTML = years.map(y => `<button data-y="${y}" class="${y === year ? "on" : ""}">${y}</button>`).join("");
  ybox.querySelectorAll("button").forEach(b => b.onclick = () => { year = +b.dataset.y;
    ybox.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); stop(); slider.value = 12; update(12); });
  document.querySelectorAll("#kind button").forEach(b => b.onclick = () => { kind = b.dataset.k;
    document.querySelectorAll("#kind button").forEach(x => x.classList.toggle("on", x === b)); update(+slider.value); });
  const slider = document.getElementById("slider"), btn = document.getElementById("playBtn");
  slider.oninput = () => { stop(); update(+slider.value); };
  function stop() { if (playTimer) { clearInterval(playTimer); playTimer = null; btn.innerHTML = '<i class="ti ti-player-play"></i>'; } }
  btn.onclick = () => {   // odtwarzanie: miesiąc po miesiącu, jak „play” w demo Radar Timeline
    if (playTimer) return stop();
    let m = 0; slider.value = 0; update(0); btn.innerHTML = '<i class="ti ti-player-pause"></i>';
    playTimer = setInterval(() => { m++; if (m > 12) return stop(); slider.value = m; update(m); }, 900);
  };
  buildChart(); update(12);
})();
</script>
</body>
</html>
