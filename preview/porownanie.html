<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd: porównanie temperatur (wiele osi dat)</title>
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/NordDark.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Responsive.js"></script>
<script src="https://cdn.amcharts.com/lib/5/locales/pl_PL.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root { --line:#2a323c; --muted:#8c98a6; --fg:#e7ecf1; --acc:#5aa2f0; }
  body { margin:0; background:#12161b; color:var(--fg); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1160px; margin:20px auto; padding:0 20px; }
  .note { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .box { background:#1b2129; border:1px solid var(--line); border-radius:12px; padding:12px 10px 8px; }
  .chead { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin:0 4px 6px; }
  h2 { margin:0; font-size:13px; color:var(--muted); letter-spacing:.04em; font-weight:600; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  .home { width:24px; height:24px; border-radius:7px; border:1px solid #3b4552; background:#222a33; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }
  .ctrls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .seg { display:flex; gap:4px; }
  .seg button { border:1px solid var(--line); background:transparent; color:var(--muted); padding:3px 10px; border-radius:6px; font:inherit; font-size:12px; cursor:pointer; }
  .seg button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .ytabs { display:flex; justify-content:flex-end; align-items:center; gap:18px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:4px -10px 0; padding:0 14px; }
  .ytabs .lbl { color:var(--muted); font-size:12px; margin-right:auto; }
  .ytabs button { border:0; background:none; color:var(--muted); padding:8px 0; cursor:pointer; font:inherit; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  .ytabs button i.dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:#3b4552; }
  .ytabs button.on { color:var(--fg); box-shadow:inset 0 -2px 0 var(--acc); }
  .sel { color:var(--muted); font-size:12px; margin:6px 4px 0; min-height:16px; }
  #chartdiv { height:440px; margin-top:4px; }
</style>
</head>
<body>
<main>
  <p class="note">Strona testowa – podgląd porównania temperatur na prawdziwych danych. Główna strona: <a href="../" style="color:#88c0d0">trekpio.github.io/Meteo</a></p>
  <section class="box">
    <div class="chead">
      <h2><span class="home"><i class="ti ti-home"></i></span>Porównanie temperatur</h2>
      <div class="ctrls">
        <div class="seg" id="kind"><button data-k="temp" class="on">Normalna</button><button data-k="feels">Odczuwalna</button></div>
        <div class="seg" id="cur"><button data-m="zoom">Zoom</button><button data-m="select">Select</button><button data-m="pan" class="on">Pan</button><button data-m="none">None</button></div>
      </div>
    </div>
    <div class="ytabs" id="years"><span class="lbl">Lata do porównania (maks. 3):</span></div>
    <div class="sel" id="info"></div>
    <div id="chartdiv"></div>
  </section>
</main>
<script>
const RAW = "https://raw.githubusercontent.com/trekPio/Meteo/main/";
const get = async (p) => { let r = await fetch(RAW + p + "?v=" + Date.now()).catch(() => null);
  if (!r || !r.ok) r = await fetch("../" + p + "?v=" + Date.now()); if (!r.ok) throw new Error(p); return r.json(); };
const KEYS = { temp: ["outdoor.temperature"], feels: ["outdoor.feels_like", "outdoor.app_temp"] };
const pick = (o, ks) => { for (const k of ks) if (o[k] != null) return o[k]; return null; };
const YCOL = [0xd08770, 0x88c0d0, 0xa3be8c, 0xb48ead, 0xebcb8b];
const fmt = (x) => x.toLocaleString("pl-PL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

let idx, years = [], selYears = [], kind = "temp", mode = "pan", root, chart, cursor, axes = [];
const cache = {};

// Średnia dobowa temperatury roku (z agregatów godzinowych), znacznik czasu w południe danego dnia
async function dailyMeans(year) {
  if (cache[year]) return cache[year];
  const months = (idx.months || []).filter(m => m.startsWith(year + "-"));
  const rows = (await Promise.all(months.map(m => get(`data/hourly/${m}.json`).catch(() => [])))).flat();
  const acc = {};
  for (const r of rows) {
    const d = new Date(r.t * 1000).toLocaleDateString("sv-SE", { timeZone: "Europe/Warsaw" });
    const a = acc[d] || (acc[d] = { temp: [0, 0, 1e9, -1e9], feels: [0, 0, 1e9, -1e9] });
    for (const k of ["temp", "feels"]) { const v = pick(r, KEYS[k]); if (v == null) continue;
      a[k][0] += v; a[k][1]++; a[k][2] = Math.min(a[k][2], v); a[k][3] = Math.max(a[k][3], v); }
  }
  const out = { temp: [], feels: [] };
  for (const d of Object.keys(acc).sort()) for (const k of ["temp", "feels"]) {
    const [s, n, mn, mx] = acc[d][k]; if (!n) continue;
    out[k].push({ t: new Date(d + "T12:00:00").getTime(), v: +(s / n).toFixed(1), lo: +mn.toFixed(1), hi: +mx.toFixed(1) });
  }
  return (cache[year] = out);
}

async function draw() {
  if (root) root.dispose();
  root = am5.Root.new("chartdiv");
  root.setThemes([am5themes_Animated.new(root), am5themes_NordDark.new(root), am5themes_Responsive.new(root)]);
  root.locale = am5locales_pl_PL;
  root.dateFormatter.setAll({ dateFormat: "d MMM", dateFields: ["valueX"] });
  chart = root.container.children.push(am5xy.XYChart.new(root, {
    panX: mode === "pan", panY: false, wheelX: "panX", wheelY: "zoomX", pinchZoomX: true, paddingLeft: 0, layout: root.verticalLayout,
  }));
  cursor = chart.set("cursor", am5xy.XYCursor.new(root, { behavior: { zoom: "zoomX", select: "selectX", pan: "none", none: "none" }[mode] }));
  cursor.lineY.set("visible", false);
  const yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, { renderer: am5xy.AxisRendererY.new(root, {}), numberFormat: "#'°C'" }));
  yAxis.get("renderer").grid.template.setAll({ strokeDasharray: [5, 5] });

  // osobna oś dat dla każdego roku (1 sty – 31 gru), nałożone na siebie: pierwsza na dole, druga u góry, kolejne bez etykiet
  axes = [];
  for (const [i, y] of selYears.entries()) {
    const d = (await dailyMeans(y))[kind], col = am5.color(YCOL[years.indexOf(y) % YCOL.length]);
    const xr = am5xy.AxisRendererX.new(root, { minGridDistance: 70, opposite: i === 1 });
    xr.labels.template.setAll({ fill: col, forceHidden: i > 1 });
    xr.grid.template.setAll({ forceHidden: i > 0, strokeDasharray: [5, 5] });
    const xAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
      baseInterval: { timeUnit: "day", count: 1 }, maxDeviation: 0, renderer: xr,
      min: new Date(y, 0, 1).getTime(), max: new Date(y, 11, 31, 23, 59).getTime(),
      tooltip: am5.Tooltip.new(root, { themeTags: ["axis"] }), tooltipDateFormat: "d MMM yyyy",
    }));
    xAxis.get("tooltip").get("background").setAll({ fill: col });
    axes.push(xAxis);
    const band = chart.series.push(am5xy.LineSeries.new(root, { xAxis, yAxis, valueXField: "t", valueYField: "hi", openValueYField: "lo", fill: col, stroke: col }));
    band.strokes.template.set("forceHidden", true); band.fills.template.setAll({ visible: true, fillOpacity: 0.08 });
    band.data.setAll(d);
    const s = chart.series.push(am5xy.LineSeries.new(root, {
      name: String(y), xAxis, yAxis, valueXField: "t", valueYField: "v", stroke: col, fill: col,
      tooltip: am5.Tooltip.new(root, { labelText: `${y}: [bold]{valueY.formatNumber('#.0')}°C[/] (min {lo} / maks {hi})` }),
    }));
    s.strokes.template.set("strokeWidth", 1.5);
    s.data.setAll(d);
  }
  // wspólne przybliżanie: wszystkie osie podążają za pierwszą
  if (axes.length > 1) axes[0].on("start", () => syncAxes()), axes[0].on("end", () => syncAxes());
  function syncAxes() { for (const a of axes.slice(1)) { a.set("start", axes[0].get("start")); a.set("end", axes[0].get("end")); } }

  const legend = chart.children.push(am5.Legend.new(root, { centerX: am5.p50, x: am5.p50, marginTop: 6 }));
  legend.data.setAll(chart.series.values.filter(s => s.get("name")));
  const sb = am5.Scrollbar.new(root, { orientation: "horizontal", height: 8, marginTop: 6 });
  chart.set("scrollbarX", sb); chart.bottomAxesContainer.children.push(sb);

  // Select: średnie temperatury w zaznaczonym okresie dla każdego roku
  cursor.events.on("selectended", () => {
    if (mode !== "select" || !axes.length) return;
    const a0 = axes[0], p1 = cursor.getPrivate("downPositionX"), p2 = cursor.getPrivate("positionX");
    const d1 = a0.positionToDate(a0.toAxisPosition(Math.min(p1, p2))), d2 = a0.positionToDate(a0.toAxisPosition(Math.max(p1, p2)));
    const md = (dt) => [dt.getMonth(), dt.getDate()];
    const [m1, dd1] = md(d1), [m2, dd2] = md(d2);
    const parts = selYears.map(y => {
      const v = cache[y][kind].filter(p => { const t = new Date(p.t); const k = [t.getMonth(), t.getDate()];
        return (k[0] > m1 || (k[0] === m1 && k[1] >= dd1)) && (k[0] < m2 || (k[0] === m2 && k[1] <= dd2)); }).map(p => p.v);
      return v.length ? `${y}: śr. ${fmt(v.reduce((s, x) => s + x, 0) / v.length)}°C` : `${y}: brak danych`;
    });
    document.getElementById("info").textContent = `${d1.toLocaleDateString("pl-PL", { day: "numeric", month: "short" })} – ${d2.toLocaleDateString("pl-PL", { day: "numeric", month: "short" })}:  ${parts.join("  ·  ")}`;
  });
  chart.appear(600, 100);
}

function setInfo() {
  document.getElementById("info").textContent = { zoom: "Przeciągnij po wykresie, aby przybliżyć ten sam okres we wszystkich latach.",
    select: "Zaznacz okres, aby porównać średnie temperatury lat.", pan: "Przeciągnij wykres, aby go przesunąć; kółko myszy przybliża.", none: "" }[mode];
}

(async () => {
  idx = await get("data/index.json");
  years = [...new Set((idx.months || []).map(m => +m.slice(0, 4)))].sort();
  selYears = years.slice(-2);
  const box = document.getElementById("years");
  years.forEach(y => {
    const b = document.createElement("button"); b.dataset.y = y;
    b.innerHTML = `<i class="dot"></i>${y}`;
    const paint = () => { const on = selYears.includes(y); b.classList.toggle("on", on);
      b.querySelector(".dot").style.background = on ? "#" + YCOL[years.indexOf(y) % YCOL.length].toString(16) : "#3b4552"; };
    b.onclick = () => {
      if (selYears.includes(y)) { if (selYears.length > 1) selYears = selYears.filter(x => x !== y); }
      else { selYears = [...selYears, y].sort().slice(-3); }
      box.querySelectorAll("button").forEach(x => x._paint()); draw();
    };
    b._paint = paint; paint(); box.appendChild(b);
  });
  document.querySelectorAll("#kind button").forEach(b => b.onclick = () => {
    kind = b.dataset.k; document.querySelectorAll("#kind button").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  document.querySelectorAll("#cur button").forEach(b => b.onclick = () => {
    mode = b.dataset.m; document.querySelectorAll("#cur button").forEach(x => x.classList.toggle("on", x === b));
    cursor.set("behavior", { zoom: "zoomX", select: "selectX", pan: "none", none: "none" }[mode]); chart.set("panX", mode === "pan"); setInfo(); });
  setInfo(); draw();
})();
</script>
</body>
</html>
