<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd: roczny wykres opadów (radar)</title>
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
<script src="https://cdn.amcharts.com/lib/5/radar.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/NordDark.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Responsive.js"></script>
<script src="https://cdn.amcharts.com/lib/5/locales/pl_PL.js"></script>
<style>
  body { margin:0; background:#12161b; color:#e7ecf1; font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1160px; margin:20px auto; padding:0 20px; }
  .note { color:#8c98a6; font-size:13px; margin:0 0 12px; }
  .box { background:#1b2129; border:1px solid #2a323c; border-radius:12px; padding:12px 10px 8px; }
  .hd { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 4px 4px; flex-wrap:wrap; }
  .hd h2 { margin:0; font-size:13px; color:#8c98a6; letter-spacing:.04em; font-weight:600; text-transform:uppercase; }
  .seg { display:flex; gap:4px; }
  .seg button { border:1px solid #2a323c; background:transparent; color:#8c98a6; padding:3px 10px; border-radius:6px; font:inherit; font-size:12px; cursor:pointer; }
  .seg button.on { background:#5aa2f0; border-color:#5aa2f0; color:#fff; }
  #chartdiv { height:720px; }
  .hint { color:#8c98a6; font-size:12px; margin:4px 6px 0; }
</style>
</head>
<body>
<main>
  <p class="note">Strona testowa – podgląd rocznego wykresu opadów na prawdziwych danych. Główna strona: <a href="../" style="color:#88c0d0">trekpio.github.io/Meteo</a></p>
  <section class="box">
    <div class="hd"><h2>Opady w roku</h2><div class="seg" id="years"></div></div>
    <div id="chartdiv"></div>
    <p class="hint">Słupki: suma opadu w tygodniu · bąble: dni z opadem (wielkość = suma dobowa) w rzędzie dnia tygodnia · kliknij miesiąc, aby go przybliżyć, kliknij ponownie, aby oddalić.</p>
  </section>
</main>
<script>
const RAW = "https://raw.githubusercontent.com/trekPio/Meteo/main/";
const get = async (p) => { let r = await fetch(RAW + p + "?v=" + Date.now()).catch(() => null);
  if (!r || !r.ok) r = await fetch("../" + p + "?v=" + Date.now()); if (!r.ok) throw new Error(p); return r.json(); };
const DAILY = ["rainfall_piezo.daily", "rainfall.daily"];
const pick = (o, ks) => { for (const k of ks) if (o[k] != null) return o[k]; return null; };
const MONTHS = ["Sty", "Lut", "Mar", "Kwi", "Maj", "Cze", "Lip", "Sie", "Wrz", "Paź", "Lis", "Gru"];
const WEEKDAYS = ["Pn", "Wt", "Śr", "Cz", "Pt", "So", "Nd"];
const fmt = (x, d = 1) => x.toLocaleString("pl-PL", { minimumFractionDigits: d, maximumFractionDigits: d });

// Sumy dobowe roku: maksimum licznika dziennego w każdym dniu (z agregatów godzinowych)
async function dailyTotals(year) {
  const idx = await get("data/index.json");
  const months = (idx.months || []).filter(m => m.startsWith(year + "-"));
  const rows = (await Promise.all(months.map(m => get(`data/hourly/${m}.json`).catch(() => [])))).flat();
  const days = {};
  for (const r of rows) {
    const v = pick(r, DAILY); if (v == null) continue;
    const d = new Date(r.t * 1000).toLocaleDateString("sv-SE", { timeZone: "Europe/Warsaw" });
    days[d] = Math.max(days[d] || 0, v);
  }
  return days;   // { "2025-05-16": 3.2, ... }
}

let root, chart;
async function draw(year) {
  if (root) root.dispose();
  const days = await dailyTotals(year);
  root = am5.Root.new("chartdiv");
  const myTheme = am5.Theme.new(root);
  myTheme.rule("Label").set("fontSize", 11);
  myTheme.rule("Grid").set("strokeOpacity", 0.06);
  root.setThemes([am5themes_Animated.new(root), am5themes_NordDark.new(root), myTheme, am5themes_Responsive.new(root)]);
  root.locale = am5locales_pl_PL;
  root.locale.firstDayOfWeek = 1;   // tydzień od poniedziałku
  root.dateFormatter.setAll({ dateFormat: "w", dateFields: ["valueX"] });

  // --- dane: tygodnie (słupki) i dni z opadem (bąble) ---
  const firstDay = new Date(year, 0, 1), weekly = [], daily = [];
  for (let i = 0; i < 53; i++) {
    const date = new Date(firstDay); date.setDate(1 + i * 7); am5.time.round(date, "week", 1, root.locale.firstDayOfWeek);
    weekly.push({ date: date.getTime(), rain: 0 });
  }
  let total = 0; const monthSum = Array(12).fill(0);
  for (const [d, v] of Object.entries(days)) {
    if (v <= 0) continue;
    const date = new Date(d + "T12:00:00");
    let wn = am5.utils.getWeek(date);
    if (wn === 1 && date.getMonth() === 11) wn = 53;
    if (wn > 50 && date.getMonth() === 0) wn = 1;   // pierwsze dni stycznia z ostatniego tygodnia poprzedniego roku
    weekly[wn - 1].rain = +(weekly[wn - 1].rain + v).toFixed(1);
    total += v; monthSum[date.getMonth()] += v;
    daily.push({ date: date.getTime(), day: WEEKDAYS[(date.getDay() + 6) % 7], rain: +v.toFixed(1),
                 title: date.toLocaleDateString("pl-PL", { day: "numeric", month: "long" }) });
  }

  chart = root.container.children.push(am5radar.RadarChart.new(root, {
    panX: false, panY: false, wheelX: "panX", wheelY: "zoomX",
    innerRadius: am5.percent(20), radius: am5.percent(80), startAngle: 270 - 170, endAngle: 270 + 170,
  }));
  chart.radarContainer.children.push(am5.Label.new(root, {
    text: `[fontSize:0.85em]Opad w ${year}:[/]\n[fontSize:1.7em]${fmt(total)} mm[/]\n[fontSize:0.8em]${daily.length} dni z opadem[/]`,
    textAlign: "center", centerX: am5.p50, centerY: am5.p50,
  }));
  chart.set("cursor", am5radar.RadarCursor.new(root, { behavior: "zoomX" })).lineY.set("visible", false);

  const dateRenderer = am5radar.AxisRendererCircular.new(root, { minGridDistance: 20 });
  dateRenderer.labels.template.setAll({ radius: 30, textType: "radial", centerY: am5.p50 });
  const dateAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
    baseInterval: { timeUnit: "week", count: 1 }, renderer: dateRenderer,
    min: new Date(year, 0, 1).getTime(), max: new Date(year + 1, 0, 1).getTime(),
  }));
  dateAxis.get("dateFormats")["week"] = "d MMM";

  const rainRenderer = am5radar.AxisRendererRadial.new(root, {
    axisAngle: 90, radius: am5.percent(60), innerRadius: am5.percent(20), inversed: true, minGridDistance: 20,
  });
  rainRenderer.labels.template.setAll({ centerX: am5.p50, minPosition: 0.05, maxPosition: 0.95 });
  const rainAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, { renderer: rainRenderer, min: 0, numberFormat: "# ' mm'" }));

  const weekRenderer = am5radar.AxisRendererRadial.new(root, { axisAngle: 90, innerRadius: am5.percent(60), radius: am5.percent(100), minGridDistance: 16 });
  weekRenderer.labels.template.setAll({ centerX: am5.p50 });
  const weekAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "day", renderer: weekRenderer }));

  const cols = chart.series.push(am5radar.RadarColumnSeries.new(root, {
    calculateAggregates: true, xAxis: dateAxis, yAxis: rainAxis, valueYField: "rain", valueXField: "date",
    tooltip: am5.Tooltip.new(root, { labelText: "Tydzień {valueX}: [bold]{valueY.formatNumber('#.0')} mm[/]" }),
  }));
  cols.columns.template.set("strokeOpacity", 0);
  cols.set("heatRules", [{ target: cols.columns.template, key: "fill", min: am5.color(0xa8d8ea), max: am5.color(0x2f5fb3), dataField: "valueY" }]);

  const bubbles = chart.series.push(am5radar.RadarLineSeries.new(root, {
    calculateAggregates: true, xAxis: dateAxis, yAxis: weekAxis, baseAxis: dateAxis,
    categoryYField: "day", valueXField: "date", valueField: "rain", maskBullets: false,
  }));
  bubbles.strokes.template.set("forceHidden", true);
  const circleTemplate = am5.Template.new({});
  bubbles.bullets.push(() => am5.Bullet.new(root, { sprite: am5.Circle.new(root, {
    fill: am5.color(0x88c0d0), fillOpacity: 0.85, tooltipText: "{title}: [bold]{value.formatNumber('#.0')} mm[/]",
  }, circleTemplate) }));
  bubbles.set("heatRules", [{ target: circleTemplate, min: 2.5, max: 16, dataField: "value", key: "radius" }]);

  cols.data.setAll(weekly);
  weekAxis.data.setAll(WEEKDAYS.map(day => ({ day })));
  bubbles.data.setAll(daily);

  // pasy miesięcy z sumą miesięczną; kliknięcie przybliża miesiąc
  const colorSet = am5.ColorSet.new(root, {});
  MONTHS.forEach((name, m) => {
    const range = dateAxis.createAxisRange(dateAxis.makeDataItem({ above: true }));
    const from = new Date(year, m, 1).getTime(), to = new Date(year, m + 1, 1).getTime();
    range.set("value", from); range.set("endValue", to);
    const fill = range.get("axisFill");
    fill.setAll({ toggleKey: "active", cursorOverStyle: "pointer", fill: colorSet.getIndex(m * 2), visible: true, dRadius: 25, innerRadius: -25,
                  tooltipText: `${name}: ${fmt(monthSum[m])} mm` });
    range.get("grid").set("visible", false);
    range.get("label").setAll({ fill: am5.color(0xffffff), textType: "circular", radius: 8,
      text: monthSum[m] > 0 ? `${name} · ${Math.round(monthSum[m])} mm` : name });
    fill.events.on("click", (ev) => {
      if (ev.target.get("active")) dateAxis.zoom(0, 1);
      else dateAxis.zoomToValues(from, to);
    });
  });
  bubbles.appear(1000); cols.appear(1000); chart.appear(1000, 100);
}

(async () => {
  const idx = await get("data/index.json");
  const years = [...new Set((idx.months || []).map(m => +m.slice(0, 4)))].sort();
  const box = document.getElementById("years");
  years.forEach(y => {
    const b = document.createElement("button"); b.textContent = y;
    b.onclick = () => { [...box.children].forEach(x => x.classList.toggle("on", x === b)); draw(y); };
    box.appendChild(b);
  });
  const def = years.includes(2025) ? 2025 : years[years.length - 1];
  [...box.children].find(b => +b.textContent === def).classList.add("on");
  draw(def);
})();
</script>
</body>
</html>
