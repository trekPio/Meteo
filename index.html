<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje meteo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
<script src="https://cdn.amcharts.com/lib/5/radar.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Dark.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/NordDark.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Responsive.js"></script>
<script src="https://cdn.amcharts.com/lib/5/locales/pl_PL.js"></script>
<style>
  :root { --bg:#12161b; --card:#1b2129; --fg:#e7ecf1; --muted:#8c98a6; --line:#2a323c; --acc:#5aa2f0; color-scheme:dark; }
  .chead { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin:0 4px 6px; }
  .chead h2 { margin:0 !important; }
  .seg { display:flex; gap:4px; }
  .seg button { border:1px solid var(--line); background:transparent; color:var(--muted); padding:3px 10px; border-radius:6px; cursor:pointer; font:inherit; font-size:12px; }
  .seg button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .sel { color:var(--muted); font-size:12px; margin:0 4px 4px; min-height:16px; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 20px 8px; display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between; max-width:1200px; margin:auto; }
  h1 { margin:0; font-size:22px; }
  #updated { color:var(--muted); font-size:13px; }
  main { max-width:1200px; margin:auto; padding:0 20px 40px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .gauges { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px; margin:12px 0; }
  .gauge { padding:10px 10px 4px; }
  .gauge h2, .chart h2 { font-size:13px; margin:0 4px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .gauge .g { height:190px; }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; }
  .mic { width:66px; height:121px; flex:none; }
  .vbox { position:relative; width:104px; height:84px; border:1.5px solid #3b4552; border-radius:14px; background:#222a33;
          display:flex; align-items:center; justify-content:center; margin-right:16px; flex:none; }
  .vval { font-size:34px; line-height:1; font-variant-numeric:tabular-nums; }
  .wunit.clk { cursor:pointer; user-select:none; } .wunit.clk:hover { background:#4c5869; }
  .wspd.ms { font-size:46px; }
  .trend { position:absolute; top:7px; left:8px; font-size:15px; color:#6b7785; }
  .trend.up { color:#c99a86; } .trend.down { color:#7fa7b8; }
  .mm { display:grid; grid-template-columns:1fr 1fr; margin-top:8px; font-size:12px; color:var(--muted); text-align:center; }
  .mm b { display:block; font-size:17px; font-weight:500; color:var(--fg); }
  .mm b.cmin { color:#88c0d0; } .mm b.cmax { color:#d08770; }
  .windtile { grid-column:span 2; }
  @media (max-width:520px) { .windtile { grid-column:auto; } }
  .wrow { display:flex; align-items:center; justify-content:space-around; gap:12px; }
  .wcomp { width:160px; height:160px; flex:none; }
  .wbox { position:relative; width:110px; height:110px; border:1.5px solid #3b4552; border-radius:14px; background:#222a33;
          display:flex; flex-direction:column; align-items:center; justify-content:center; margin-right:18px; flex:none; }
  .wunit { position:absolute; top:16px; right:0; transform:translateX(50%); background:#3b4552; color:#e7ecf1; font-size:12px; font-weight:600; padding:3px 8px; border-radius:7px; }
  .wspd { font-size:64px; line-height:1; font-variant-numeric:tabular-nums; }
  .wdir { font-size:13px; color:#cfd6de; margin-top:4px; }
  .wfoot { display:grid; grid-template-columns:1fr 1fr; text-align:center; margin-top:6px; }
  .wfoot .l { font-size:12px; color:var(--muted); }
  .wfoot .v { font-size:22px; } .wfoot .v i, .wfoot small { color:var(--muted); font-size:13px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; margin:0 0 24px; }
  .card { padding:12px 14px; }
  .card .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .card .v { font-size:24px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
  .card .v small { font-size:14px; font-weight:400; color:var(--muted); margin-left:3px; }
  .card .s { color:var(--muted); font-size:12px; }
  .ranges { display:flex; gap:6px; }
  .ranges button { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; border-radius:8px; cursor:pointer; font:inherit; }
  .ranges button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .charts { display:grid; grid-template-columns:1fr; gap:16px; }
  .chart { padding:12px 10px 6px; }
  .chart .c { height:340px; }
  #err { color:#d9534f; }
</style>
</head>
<body>
<header>
  <div><h1>Moje meteo</h1><div id="updated">Ładowanie…</div></div>
  <div class="ranges">
    <button data-d="1" class="on">24 h</button><button data-d="3">3 dni</button>
    <button data-d="7">7 dni</button><button data-d="30">30 dni</button><button data-d="365">Rok</button>
  </div>
</header>
<main>
  <div id="err"></div>
  <div class="gauges" id="gauges"></div>
  <div class="cards" id="cards"></div>
  <div class="charts" id="charts"></div>
  <div class="charts" id="rose" style="margin-top:16px"></div>
</main>

<script>
// ---------- Konfiguracja ----------
// Klucze z API Ecowitt (pierwszy istniejący z listy zostaje użyty)
const K = {
  temp: ["outdoor.temperature"], feels: ["outdoor.feels_like", "outdoor.app_temp"],
  dew: ["outdoor.dew_point"], hum: ["outdoor.humidity"],
  tin: ["indoor.temperature"], hin: ["indoor.humidity"],
  press: ["pressure.relative", "pressure.absolute"],
  wind: ["wind.wind_speed"], gust: ["wind.wind_gust"], dir: ["wind.wind_direction"],
  rainDay: ["rainfall.daily", "rainfall_piezo.daily"], rainRate: ["rainfall.rain_rate", "rainfall_piezo.rain_rate"],
  rainWeek: ["rainfall.weekly", "rainfall_piezo.weekly"], rainMonth: ["rainfall.monthly", "rainfall_piezo.monthly"],
  rainYear: ["rainfall.yearly", "rainfall_piezo.yearly"],
  solar: ["solar_and_uvi.solar"], uvi: ["solar_and_uvi.uvi"],
};
// Wykresy: seria = [klucz, nazwa, kolor, typ?]; s2 = seria na prawej osi
const CHARTS = [
  { t: "Temperatura (°C)", nord: true, s: [["temp", "Temperatura", "#e8684a"], ["feels", "Odczuwalna", "#f6bd16"], ["dew", "Punkt rosy", "#29a3a3"]] },
  { t: "Wilgotność (%)", s: [["hum", "Na zewnątrz", "#5b8ff9"], ["hin", "Wewnątrz", "#9270ca"]] },
  { t: "Ciśnienie (hPa)", s: [["press", "Ciśnienie", "#8c98a6"]] },
  { t: "Wiatr (m/s)", s: [["wind", "Prędkość", "#4caf50"], ["gust", "Porywy", "#a5d6a7"]] },
  { t: "Opad (mm)", s: [["rainDay", "Suma dzienna", "#5b8ff9", "step"], ["rainRate", "Intensywność mm/h", "#90caf9"]] },
  { t: "Słońce (W/m²) i UV", s: [["solar", "Promieniowanie", "#f6bd16"]], s2: [["uvi", "UV", "#e8684a"]] },
];
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const DARK = true;   // cała strona w ciemnym motywie

// ---------- Pomocnicze ----------
const pick = (o, name) => { for (const k of K[name]) if (o[k] != null) return o[k]; return null; };
const fmt = (v, d = 1) => v == null ? "–" : v.toLocaleString("pl-PL", { maximumFractionDigits: d, minimumFractionDigits: d });
const get = async (p) => { const r = await fetch(p + "?v=" + Date.now()); if (!r.ok) throw new Error(p + ": " + r.status); return r.json(); };
const err = (e) => document.getElementById("err").textContent = e ? "Nie udało się wczytać danych: " + e.message : "";

function newRoot(el) {
  const root = am5.Root.new(el);
  root.setThemes([am5themes_Animated.new(root), ...(DARK ? [am5themes_Dark.new(root)] : [])]);
  root.locale = am5locales_pl_PL;
  root.numberFormatter.set("numberFormat", "#,###.#");
  return root;
}

// ---------- Kafelki: temperatura, wilgotność, ciśnienie (SVG) ----------
const FG = "#e7ecf1", TILE_BG = "#1b2129", COLD_BELOW = 10;   // poniżej 10 °C szronek, od 10 °C słoneczko

function iconThermo(t) {
  const lvl = Math.max(0, Math.min(1, ((t ?? 0) + 20) / 60)), top = (160 - lvl * 116).toFixed(1);
  let sc = ""; for (let i = 0; i < 9; i++) { const y = 44 + i * 15, l = i % 4 === 0 ? 26 : 15; sc += `<line x1="80" y1="${y}" x2="${80 + l}" y2="${y}"/>`; }
  const flake = (w, c) => { let g = ""; for (let a = 0; a < 180; a += 60) g += `<g transform="rotate(${a} 32 34)"><line x1="32" y1="10" x2="32" y2="58"/><path d="M24 13 l8 7 l8 -7 M24 55 l8 -7 l8 7" fill="none"/></g>`;
    return `<g stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${g}</g>`; };
  const sun = (w, c) => { let g = `<circle cx="32" cy="34" r="11" fill="${c}" stroke="${c}" stroke-width="${w - 6}"/>`;
    for (let a = 0; a < 360; a += 45) { const [x1, y1] = polarC(a, 17, 32, 34), [x2, y2] = polarC(a, 25, 32, 34); g += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }
    return `<g stroke="${c}" stroke-width="${w}" stroke-linecap="round">${g}</g>`; };
  const sym = (t ?? 0) < COLD_BELOW ? flake : sun;
  return `<g fill="none" stroke="${FG}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M41 157 V66"/><path d="M63 157 V40 a11 11 0 0 0 -16 -10"/><path d="M41 157 A28 28 0 1 0 63 157"/></g>
    <rect x="47" y="${top}" width="10" height="${(186 - top).toFixed(1)}" rx="5" fill="${FG}"/>
    <circle cx="52" cy="182" r="16" fill="${FG}"/>
    <g stroke="${FG}" stroke-width="3.5" stroke-linecap="round">${sc}</g>${sym(16, TILE_BG)}${sym(6, FG)}`;
}
function iconDrop(h) {
  const d = "M60 40 C60 40 28 92 28 120 a32 32 0 0 0 64 0 C92 92 60 40 60 40Z", y = (152 - Math.max(0, Math.min(100, h ?? 0)) / 100 * 112).toFixed(1);
  return `<defs><clipPath id="dropClip"><path d="${d}"/></clipPath></defs>
    <rect x="0" y="${y}" width="120" height="220" fill="#5e81ac" clip-path="url(#dropClip)"/>
    <path d="${d}" fill="none" stroke="${FG}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M44 124 a17 17 0 0 0 12 16" fill="none" stroke="${FG}" stroke-width="4" stroke-linecap="round"/>`;
}
function iconBaro(p, trend) {
  let tk = ""; for (let a = -120; a <= 120; a += 40) { const [x1, y1] = polarC(a, 30, 60, 116), [x2, y2] = polarC(a, 23, 60, 116); tk += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }
  const ang = -120 + Math.max(0, Math.min(1, ((p ?? 960) - 960) / 90)) * 240;
  const tr = trend > 0.5 ? `<path d="M60 56 l-9 12 h18 z" fill="#a3be8c"/>` : trend < -0.5 ? `<path d="M60 68 l-9 -12 h18 z" fill="#bf616a"/>` : "";
  return `<circle cx="60" cy="116" r="38" fill="none" stroke="${FG}" stroke-width="6"/>
    <g stroke="#8c98a6" stroke-width="3" stroke-linecap="round">${tk}</g>
    <line x1="60" y1="116" x2="60" y2="88" stroke="${FG}" stroke-width="5" stroke-linecap="round" transform="rotate(${ang.toFixed(1)} 60 116)"/>
    <circle cx="60" cy="116" r="6" fill="${FG}"/>${tr}`;
}
const polarC = (a, r, cx, cy) => { const t = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };

// Trend: zmiana względem pomiaru sprzed ok. 1 h (poniżej progu = stała)
const TREND_EPS = { temp: 0.3, hum: 2, press: 0.5, wind: 0.8 };
function setTrend(key, rows, cur) {
  const el = document.getElementById("tr-" + key); if (!el) return;
  const now = rows.length ? rows[rows.length - 1].t : Date.now() / 1000;
  const old = rows.filter(r => r.t <= now - 3000 && pick(r, key) != null).pop();
  let cls = "ti-arrow-narrow-right", st = "", tip = "stała";
  if (old && cur != null) {
    const d = cur - pick(old, key);
    if (d > TREND_EPS[key]) { cls = "ti-arrow-up-right"; st = "up"; tip = "rośnie"; }
    else if (d < -TREND_EPS[key]) { cls = "ti-arrow-down-right"; st = "down"; tip = "maleje"; }
  } else { el.className = "ti trend"; el.title = ""; return; }
  el.className = `ti trend ${cls} ${st}`; el.title = `Trend (1 h): ${tip}`;
}

const TILES = [["temp", "Temperatura", "°C", 1], ["hum", "Wilgotność", "%", 0], ["press", "Ciśnienie", "hPa", 1]];

function buildGauges() {
  const box = document.getElementById("gauges");
  for (const [key, title, unit] of TILES) {
    const el = document.createElement("section"); el.className = "box gauge mtile";
    el.innerHTML = `<h2>${title}</h2>
      <div class="mrow"><svg id="ic-${key}" viewBox="0 0 120 220" class="mic" aria-hidden="true"></svg>
        <div class="vbox"><span class="wunit${key === "temp" ? " clk" : ""}" id="u-${key}"${key === "temp" ? ' title="Kliknij: °C / K"' : ""}>${unit}</span><i class="ti trend" id="tr-${key}"></i><span class="vval" id="v-${key}">–</span></div></div>
      <div class="wfoot">
        <div><div class="l">Min · <span id="tmin-${key}">–</span></div><div class="v"><i class="ti ti-arrow-down"></i> <span id="min-${key}">–</span> <small class="u2-${key}">${unit}</small></div></div>
        <div><div class="l">Maks · <span id="tmax-${key}">–</span></div><div class="v"><i class="ti ti-arrow-up"></i> <span id="max-${key}">–</span> <small class="u2-${key}">${unit}</small></div></div></div>`;
    box.appendChild(el);
  }
  buildWindTile(box);
  document.getElementById("u-temp").onclick = () => { tempUnit = tempUnit === "C" ? "K" : "C"; saveUnits(); redrawTiles(); };
  document.getElementById("u-wind").onclick = () => { windUnit = windUnit === "kmh" ? "ms" : "kmh"; saveUnits(); redrawTiles(); };
}

// ---------- Jednostki przełączane kliknięciem (zapamiętywane w przeglądarce) ----------
let tempUnit = "C", windUnit = "kmh", lastTiles = null;
try { const u = JSON.parse(localStorage.getItem("meteoUnits") || "{}"); tempUnit = u.t || "C"; windUnit = u.w || "kmh"; } catch (e) {}
const saveUnits = () => { try { localStorage.setItem("meteoUnits", JSON.stringify({ t: tempUnit, w: windUnit })); } catch (e) {} };
const redrawTiles = () => { if (lastTiles) { updateGauges(...lastTiles.g); updateWindTile(...lastTiles.w); } };
const tConv = (c) => c == null ? null : tempUnit === "K" ? c + 273.15 : c;
const tLabel = () => tempUnit === "K" ? "K" : "°C";

function updateGauges(v, rows = []) {
  const hm = (t) => new Date(t * 1000).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
  const f = (x, d) => fmt(x, d).replace("-", "−");
  document.getElementById("u-temp").textContent = tLabel();
  document.getElementById("v-temp").style.fontSize = tempUnit === "K" ? "27px" : "";
  document.querySelectorAll(".u2-temp").forEach(e => e.textContent = tLabel());
  for (const [key, , , dec] of TILES) {
    const cv = key === "temp" ? tConv : (x) => x;
    const val = cv(pick(v, key));
    document.getElementById("v-" + key).textContent = val == null ? "–" : f(val, key === "press" ? 0 : dec);
    let mn = null, mx = null;
    for (const r of rows) { const x = pick(r, key); if (x == null) continue;
      if (!mn || x < mn.x) mn = { x, t: r.t }; if (!mx || x > mx.x) mx = { x, t: r.t }; }
    if (mn) { document.getElementById("min-" + key).textContent = f(cv(mn.x), dec); document.getElementById("tmin-" + key).textContent = hm(mn.t); }
    if (mx) { document.getElementById("max-" + key).textContent = f(cv(mx.x), dec); document.getElementById("tmax-" + key).textContent = hm(mx.t); }
  }
  for (const [key] of TILES) setTrend(key, rows, pick(v, key));
  setTrend("wind", rows, pick(v, "wind"));
  document.getElementById("ic-temp").innerHTML = iconThermo(pick(v, "temp"));
  document.getElementById("ic-hum").innerHTML = iconDrop(pick(v, "hum"));
  // tendencja ciśnienia: zmiana względem pomiaru sprzed ~3 h
  const now = rows.length ? rows[rows.length - 1].t : Date.now() / 1000;
  const old = rows.filter(r => r.t <= now - 3 * 3600 && pick(r, "press") != null).pop();
  const p = pick(v, "press");
  document.getElementById("ic-press").innerHTML = iconBaro(p, old && p != null ? p - pick(old, "press") : 0);
}

// ---------- Kafelek wiatru (SVG, km/h) ----------
const kmh = (ms) => ms == null ? null : windUnit === "ms" ? fmt(ms, 1) : Math.round(ms * 3.6);
const wLabel = () => windUnit === "ms" ? "m/s" : "km/h";
const polar = (a, r) => { const t = (a - 90) * Math.PI / 180; return [100 + r * Math.cos(t), 100 + r * Math.sin(t)]; };

function buildWindTile(box) {
  let minor = "";
  for (let i = 0; i < 16; i++) {
    if (i % 4 === 0) continue;
    const [x1, y1] = polar(i * 22.5, 67.5), [x2, y2] = polar(i * 22.5, i % 2 ? 73 : 76);
    minor += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  const el = document.createElement("section"); el.className = "box gauge windtile";
  el.innerHTML = `<h2>Wiatr <span id="wAge" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2>
  <div class="wrow">
    <svg viewBox="0 0 200 200" class="wcomp" role="img" aria-label="Kierunek wiatru">
      <circle cx="100" cy="100" r="66" fill="none" stroke="#3b4552" stroke-width="3"/>
      <g stroke="#6b7785" stroke-width="1.5">${minor}</g>
      <g stroke="#cfd6de" stroke-width="3" stroke-linecap="round">
        <line x1="100" y1="16" x2="100" y2="28"/><line x1="184" y1="100" x2="172" y2="100"/>
        <line x1="100" y1="184" x2="100" y2="172"/><line x1="16" y1="100" x2="28" y2="100"/></g>
      <text x="100" y="11" text-anchor="middle" font-size="11" fill="#8c98a6">N</text>
      <path id="wArc" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <g id="wArrow" style="transition:transform .8s ease;transform-box:view-box;transform-origin:100px 100px">
        <path d="M100 58 L126 134 L100 118 L74 134 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g>
    </svg>
    <div class="wbox"><span class="wunit clk" id="u-wind" title="Kliknij: km/h / m/s">km/h</span><i class="ti trend" id="tr-wind"></i><span id="wSpd" class="wspd">–</span><span id="wDir" class="wdir"></span></div>
  </div>
  <div class="wfoot">
    <div><div class="l">Porywy</div><div class="v"><i class="ti ti-wind"></i> <span id="wGust">–</span> <small class="u2-wind">km/h</small></div></div>
    <div><div class="l">Maks. dziś</div><div class="v"><i class="ti ti-trending-up"></i> <span id="wMax">–</span> <small class="u2-wind">km/h</small></div></div>
  </div>`;
  box.appendChild(el);
}

function updateWindTile(v, t, maxToday) {
  document.getElementById("u-wind").textContent = wLabel();
  document.querySelectorAll(".u2-wind").forEach(e => e.textContent = wLabel());
  const d = pick(v, "dir");
  document.getElementById("wSpd").textContent = kmh(pick(v, "wind")) ?? "–";
  document.getElementById("wSpd").classList.toggle("ms", windUnit === "ms");
  document.getElementById("wGust").textContent = kmh(pick(v, "gust")) ?? "–";
  document.getElementById("wMax").textContent = kmh(maxToday) ?? "–";
  const age = Math.round((Date.now() / 1000 - t) / 60);
  document.getElementById("wAge").textContent = "· " + (age < 1 ? "teraz" : age + " min temu");
  if (d == null) return;
  document.getElementById("wDir").textContent = `${DIRS[Math.round(d / 22.5) % 16]} (${Math.round(d)}°)`;
  document.getElementById("wArrow").style.transform = `rotate(${(d + 180) % 360}deg)`;   // strzałka: dokąd wieje
  const [x1, y1] = polar(d - 14, 66), [x2, y2] = polar(d + 14, 66);                      // łuk: skąd wieje
  document.getElementById("wArc").setAttribute("d", `M${x1.toFixed(1)} ${y1.toFixed(1)} A66 66 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
}


// ---------- Kafelki ----------
function updateCards(v) {
  const cards = [
    ["Odczuwalna", fmt(pick(v, "feels")), "°C", "punkt rosy " + fmt(pick(v, "dew")) + " °C"],
    ["Opad dziś", fmt(pick(v, "rainDay")), "mm", "teraz " + fmt(pick(v, "rainRate")) + " mm/h"],
    ["Opad w miesiącu", fmt(pick(v, "rainMonth")), "mm", "tydzień " + fmt(pick(v, "rainWeek")) + " · rok " + fmt(pick(v, "rainYear"), 0) + " mm"],
    ["Słońce", fmt(pick(v, "solar"), 0), "W/m²", "UV " + fmt(pick(v, "uvi"))],
    ["W domu", fmt(pick(v, "tin")), "°C", "wilgotność " + fmt(pick(v, "hin"), 0) + " %"],
  ].filter(c => c[1] !== "–");
  document.getElementById("cards").innerHTML = cards.map(([l, val, u, s]) =>
    `<div class="box card"><div class="l">${l}</div><div class="v">${val}<small>${u}</small></div><div class="s">${s}</div></div>`).join("");
}


// ---------- Róża wiatrów (radialny histogram, motyw Nord Dark) ----------
let rose = null;   // {series, xAxis}

function roseData(rows) {
  const data = DIRS.map(d => ({ dir: d, n: 0, sum: 0, max: 0 })); let n = 0;
  for (const r of rows) {
    const d = pick(r, "dir"), w = pick(r, "wind");
    if (d == null || w == null) continue;
    const o = data[Math.round(d / 22.5) % 16];
    o.n++; o.sum += w; o.max = Math.max(o.max, pick(r, "gust") ?? w); n++;
  }
  data.forEach(o => { o.pct = n ? +(o.n / n * 100).toFixed(1) : 0; o.avg = o.n ? +(o.sum / o.n).toFixed(1) : 0; o.max = +o.max.toFixed(1); });
  return { data, n };
}

let roseRange = 7, roseRoot = null;
const ROSE_RANGES = [[1, "24 h"], [7, "7 dni"], [30, "30 dni"], [365, "Rok"]];

async function loadWindRose() {
  try { buildWindRose(await loadRows(roseRange)); } catch (e) { err(e); }
}

function buildWindRose(rows) {
  if (roseRoot) roseRoot.dispose(); roseRoot = null; rose = null;
  const box = document.getElementById("rose"); box.innerHTML = "";
  const { data, n } = roseData(rows);
  const el = document.createElement("section"); el.className = "box chart";
  el.innerHTML = `<div class="chead"><h2>Róża wiatrów (% czasu, ${n} pomiarów)</h2><div class="seg">${
    ROSE_RANGES.map(([d, l]) => `<button data-d="${d}" class="${d === roseRange ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="c" style="height:480px"></div>`;
  box.appendChild(el);
  el.querySelectorAll(".seg button").forEach(b => b.onclick = () => { roseRange = +b.dataset.d; loadWindRose(); });
  if (!n) { el.querySelector(".c").outerHTML = `<p style="color:var(--muted);margin:4px">Brak danych o wietrze w tym zakresie.</p>`; return; }
  const root = am5.Root.new(el.querySelector(".c")); roseRoot = root;
  root.setThemes([am5themes_Animated.new(root), am5themes_NordDark.new(root)]);
  root.locale = am5locales_pl_PL;
  // N na środku górnego sektora: obrót o pół sektora (360/16/2 = 11,25°)
  const chart = root.container.children.push(am5radar.RadarChart.new(root, {
    panX: false, panY: false, startAngle: -101.25, endAngle: 258.75, radius: am5.percent(88), innerRadius: am5.percent(35),
  }));
  const xr = am5radar.AxisRendererCircular.new(root, { minGridDistance: 10 });
  xr.labels.template.setAll({ radius: 10, fontSize: 13, textType: "adjusted" });
  xr.grid.template.set("forceHidden", true);
  const xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "dir", renderer: xr }));
  xAxis.data.setAll(data);
  const yr = am5radar.AxisRendererRadial.new(root, {});
  yr.labels.template.setAll({ fontSize: 10, centerX: am5.p50 });
  const yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, { min: 0, numberFormat: "#'%'", renderer: yr }));
  const series = chart.series.push(am5radar.RadarColumnSeries.new(root, {
    name: "Wiatr", xAxis, yAxis, valueYField: "pct", categoryXField: "dir",
    tooltip: am5.Tooltip.new(root, { labelText: "[bold]{categoryX}[/]: {valueY.formatNumber('#.0')}% czasu\nśrednio {avg} m/s · maks. {max} m/s" }),
  }));
  series.columns.template.setAll({ width: am5.percent(80), strokeOpacity: 0, fillOpacity: 1, cornerRadius: 10 });
  // Kolor dla każdego słupka z palety motywu
  series.columns.template.adapters.add("fill", (fill, target) => chart.get("colors").getIndex(series.columns.indexOf(target)));
  series.data.setAll(data);
  series.appear(800); chart.appear(800, 100);
  rose = { series, xAxis };
}

function updateWindRose(rows) {
  if (!rose) return;
  const { data } = roseData(rows);
  rose.xAxis.data.setAll(data); rose.series.data.setAll(data);
}

// ---------- Tryby kursora (wykres temperatury) ----------
const CURSOR_MODES = [["zoom", "Zoom"], ["select", "Select"], ["pan", "Pan"], ["none", "None"]];
let cursorMode = "pan";

function setupCursorModes(el, chart, cursor, getX, rows, key) {
  const sel = el.querySelector(".sel");
  const apply = (m) => {
    cursorMode = m;
    cursor.set("behavior", { zoom: "zoomX", select: "selectX", pan: "none", none: "none" }[m]);
    chart.set("panX", m === "pan");
    el.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    sel.textContent = { zoom: "Przeciągnij po wykresie, aby przybliżyć wybrany fragment.",
      select: "Zaznacz fragment, aby zobaczyć statystyki temperatury.",
      pan: "Przeciągnij wykres, aby go przesunąć; kółko myszy przybliża.", none: "" }[m];
  };
  el.querySelectorAll(".seg button").forEach(b => b.onclick = () => apply(b.dataset.m));
  cursor.events.on("selectended", () => {
    if (cursorMode !== "select") return;
    const x = getX(), toT = (p) => x.positionToDate(x.toAxisPosition(p)).getTime() / 1000;
    let a = toT(cursor.getPrivate("downPositionX")), b = toT(cursor.getPrivate("positionX"));
    if (a > b) [a, b] = [b, a];
    const v = rows.filter(r => r.t >= a && r.t <= b).map(r => pick(r, key)).filter(x => x != null);
    if (!v.length) { sel.textContent = "Brak danych w zaznaczeniu."; return; }
    const f = (t) => new Date(t * 1000).toLocaleString("pl-PL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    sel.textContent = `${f(a)} – ${f(b)}:  min ${fmt(Math.min(...v))} °C · maks ${fmt(Math.max(...v))} °C · średnio ${fmt(v.reduce((s, x) => s + x, 0) / v.length)} °C`;
  });
  apply(cursorMode);
}

// ---------- Wykresy ----------
let range = 1, chartRoots = [], seriesList = [];   // seriesList: {series, key}

function buildCharts(rows) {
  chartRoots.forEach(r => r.dispose()); chartRoots = []; seriesList = [];
  const box = document.getElementById("charts"); box.innerHTML = "";
  for (const c of CHARTS) {
    const all = [...c.s.map(s => [...s, false]), ...(c.s2 || []).map(s => [...s, true])]
      .filter(([key]) => rows.some(r => pick(r, key) != null));
    if (!all.length) continue;

    const el = document.createElement("section"); el.className = "box chart";
    el.innerHTML = c.nord
      ? `<div class="chead"><h2>${c.t}</h2><div class="seg">${CURSOR_MODES.map(([m, l]) =>
          `<button data-m="${m}" class="${m === cursorMode ? "on" : ""}">${l}</button>`).join("")}</div></div><div class="sel"></div><div class="c"></div>`
      : `<h2>${c.t}</h2><div class="c"></div>`;
    box.appendChild(el);
    let root;
    if (c.nord) {   // styl "Data Grouping": Nord Dark + Responsive
      root = am5.Root.new(el.querySelector(".c"));
      root.setThemes([am5themes_Animated.new(root), am5themes_NordDark.new(root), am5themes_Responsive.new(root)]);
      root.locale = am5locales_pl_PL;
    } else root = newRoot(el.querySelector(".c"));
    chartRoots.push(root);
    root.dateFormatter.setAll({ dateFormat: "d MMM HH:mm", dateFields: ["valueX"] });

    const chart = root.container.children.push(am5xy.XYChart.new(root, {
      panX: true, panY: false, wheelX: "panX", wheelY: "zoomX", pinchZoomX: true, paddingLeft: 0, layout: root.verticalLayout,
    }));
    // Nord: przeciąganie przesuwa wykres (Pan); pozostałe: zaznaczenie przybliża
    const cursor = chart.set("cursor", am5xy.XYCursor.new(root, { behavior: c.nord ? "none" : "zoomX" }));
    cursor.lineY.set("visible", false);
    if (c.nord) setupCursorModes(el, chart, cursor, () => xAxis, rows, c.s[0][0]);

    const xAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
      baseInterval: { timeUnit: "minute", count: 1 }, groupData: true, groupCount: 400,
      maxDeviation: 0, renderer: am5xy.AxisRendererX.new(root, { minGridDistance: c.nord ? 60 : 80, minorGridEnabled: !!c.nord }),
      tooltip: am5.Tooltip.new(root, {}), tooltipDateFormat: "d MMM, HH:mm",
    }));
    const yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, { renderer: am5xy.AxisRendererY.new(root, {}) }));
    if (c.nord) [xAxis, yAxis].forEach(a => a.get("renderer").grid.template.setAll({ strokeDasharray: [5, 5] }));
    let y2 = null;
    if (all.some(s => s[4])) {
      y2 = chart.yAxes.push(am5xy.ValueAxis.new(root, { min: 0, renderer: am5xy.AxisRendererY.new(root, { opposite: true }) }));
      y2.get("renderer").grid.template.set("forceHidden", true);
    }

    for (const [key, name, color, type, right] of all) {
      const Cls = type === "step" ? am5xy.StepLineSeries : am5xy.LineSeries;
      const s = chart.series.push(Cls.new(root, {
        name, xAxis, yAxis: right ? y2 : yAxis, valueXField: "t", valueYField: "v",
        ...(c.nord ? {} : { stroke: am5.color(color), fill: am5.color(color) }), autoGapCount: 180,
        tooltip: am5.Tooltip.new(root, { labelText: "{name}: [bold]{valueY.formatNumber('#.0')}[/]" }),
      }));
      s.strokes.template.set("strokeWidth", c.nord ? 1 : 2);
      if (c.nord) s.fills.template.setAll({ visible: true, fillOpacity: .08 });
      else if (all.length === 1) s.fills.template.setAll({ visible: true, fillOpacity: .12 });
      s.data.setAll(seriesData(rows, key));
      seriesList.push({ series: s, key });
    }

    if (c.nord) {   // suwak z podglądem przebiegu temperatury
      const sb = am5xy.XYChartScrollbar.new(root, { orientation: "horizontal", height: 50 });
      chart.set("scrollbarX", sb);
      const sbx = sb.chart.xAxes.push(am5xy.DateAxis.new(root, {
        baseInterval: { timeUnit: "minute", count: 1 }, groupData: true, groupCount: 300,
        groupIntervals: [{ timeUnit: "minute", count: 10 }, { timeUnit: "hour", count: 1 }, { timeUnit: "hour", count: 6 }, { timeUnit: "day", count: 1 }],
        renderer: am5xy.AxisRendererX.new(root, { minorGridEnabled: true, opposite: false, strokeOpacity: 0 }),
      }));
      const sby = sb.chart.yAxes.push(am5xy.ValueAxis.new(root, { renderer: am5xy.AxisRendererY.new(root, {}) }));
      const sbs = sb.chart.series.push(am5xy.LineSeries.new(root, { xAxis: sbx, yAxis: sby, valueXField: "t", valueYField: "v" }));
      sbs.data.setAll(seriesData(rows, all[0][0]));
      seriesList.push({ series: sbs, key: all[0][0] });
    } else {
      const sb = am5.Scrollbar.new(root, { orientation: "horizontal", height: 8, marginTop: 6 });
      chart.set("scrollbarX", sb); chart.bottomAxesContainer.children.push(sb);
    }
    if (all.length > 1) {
      const legend = chart.children.push(am5.Legend.new(root, { centerX: am5.p50, x: am5.p50, marginTop: 4 }));
      legend.labels.template.set("fontSize", 12); legend.markers.template.setAll({ width: 12, height: 12 });
      legend.data.setAll(chart.series.values);
    }
  }
  if (!box.children.length) box.innerHTML = `<p style="color:var(--muted)">Brak danych historycznych dla tego zakresu.</p>`;
}

const seriesData = (rows, key) => rows.map(r => ({ t: r.t * 1000, v: pick(r, key) })).filter(p => p.v != null);

async function loadRows(r = range) {
  const idx = await get("data/index.json");
  const from = Date.now() / 1000 - r * 86400;
  if (r > 30) {   // widok roczny: agregaty godzinowe z plików miesięcznych
    const fromMonth = new Date(from * 1000).toISOString().slice(0, 7);
    const months = (idx.months || []).filter(m => m >= fromMonth);
    return (await Promise.all(months.map(m => get(`data/hourly/${m}.json`).catch(() => [])))).flat()
      .filter(r => r.t >= from).sort((a, b) => a.t - b.t);
  }
  const fromDay = new Date((from - 86400) * 1000).toISOString().slice(0, 10);
  const days = idx.days.filter(d => d >= fromDay);
  return (await Promise.all(days.map(d => get(`data/days/${d}.json`).catch(() => [])))).flat()
    .filter(r => r.t >= from).sort((a, b) => a.t - b.t);
}

// ---------- Odświeżanie ----------
async function loadLatest() {
  const L = await get("data/latest.json"), v = L.values;
  const age = Math.round((Date.now() / 1000 - L.t) / 60);
  document.getElementById("updated").textContent =
    "Pomiar: " + new Date(L.t * 1000).toLocaleString("pl-PL") + (age > 30 ? ` (${age} min temu)` : "");
  updateCards(v);
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Warsaw" });
  const rows = await get(`data/days/${today}.json`).catch(() => []);
  updateGauges(v, rows);
  const vals = rows.map(r => pick(r, "gust") ?? pick(r, "wind")).filter(x => x != null);
  const mxw = vals.length ? Math.max(...vals, pick(v, "gust") ?? 0) : pick(v, "gust");
  updateWindTile(v, L.t, mxw);
  lastTiles = { g: [v, rows], w: [v, L.t, mxw] };
}

async function rebuild() { try { err(); buildCharts(await loadRows()); } catch (e) { err(e); } }

async function refresh() {   // co 5 min: tylko dane, bez resetowania zoomu
  try {
    err(); await loadLatest();
    const rows = await loadRows();
    seriesList.forEach(({ series, key }) => series.data.setAll(seriesData(rows, key)));
    updateWindRose(roseRange === range ? rows : await loadRows(roseRange));
  } catch (e) { err(e); }
}

document.querySelectorAll(".ranges button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".ranges button").forEach(x => x.classList.toggle("on", x === b));
  range = +b.dataset.d; rebuild();
});

buildGauges();
loadLatest().catch(err);
rebuild();
loadWindRose();
setInterval(refresh, 5 * 60 * 1000);
</script>
