name: Pobierz dane Ecowitt

on:
  schedule:
           - cron: "*/10 * * * *"   # co 10 min (GitHub bywa opóźniony)
  workflow_dispatch:          # cron-job.org, przycisk na stronie lub zakładka Actions
    inputs:
      source:
        description: "Źródło pobrania"
        type: choice
        options: [auto, manual]
        default: auto

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Pobierz pomiar
        env:
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
          FETCH_SOURCE: ${{ inputs.source || 'auto' }}
        run: python3 scripts/fetch.py

      - name: Pobierz stacje Netatmo z okolicy
        continue-on-error: true      # błąd Netatmo nie blokuje danych Ecowitt
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: python3 scripts/netatmo.py

      - name: Zapisz zmiany
        run: |
          git config user.name "meteo-bot"
          git config user.email "meteo-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Bez zmian"; exit 0
          fi
          git commit -m "dane $(TZ=Europe/Warsaw date +"%Y-%m-%d %H:%M")"
          git pull --rebase
          git push
