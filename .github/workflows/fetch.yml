name: Pobierz dane Ecowitt

on:
  schedule:
    - cron: "*/10 * * * *"   # co 10 min (GitHub bywa opóźniony)
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz pomiar
        env:
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python3 scripts/fetch.py

      - name: Zapisz zmiany
        run: |
          git config user.name "meteo-bot"
          git config user.email "meteo-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Bez zmian"; exit 0
          fi
          git commit -m "dane $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
